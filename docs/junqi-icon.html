<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>军棋图标生成器</title>
<!--
  军棋图标出图（照 jungle-icon.html 家法）：
  1. Chrome headless 截图：
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
       --screenshot=/tmp/junqi-icon.png --window-size=512,512 --default-background-color=00000000 \
       "file://$(pwd)/docs/junqi-icon.html"
  2. 缩到 256：
     sips -z 256 256 /tmp/junqi-icon.png
  3. 落库：
     cp /tmp/junqi-icon.png frontend/cdn-assets/static/icons/junqi-1.png
  4. 上传：python3 frontend/scripts/upload_qiniu.py
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Noto Sans SC", sans-serif;
  }
  .card {
    width: 440px;
    height: 440px;
    border-radius: 96px;
    background: #FFF8F0;
    border: 10px solid #F0E4D7;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 棋盘格底纹 */
  .grid {
    position: absolute;
    inset: 30px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: 1fr;
    gap: 8px;
    opacity: 0.5;
  }
  .grid i { border-radius: 12px; background: #F7EEDF; border: 3px solid #E8D9C4; }
  .grid i.rail { background: #F3E2C7; border-color: #C9A876; }
  /* 两枚对撞棋子 */
  .piece {
    position: absolute;
    width: 176px;
    height: 176px;
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 88px;
    font-weight: 800;
    color: #fff;
    z-index: 2;
  }
  .piece .badge {
    position: absolute;
    right: -12px;
    bottom: -12px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #FFF8F0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }
  .piece--si {
    background: #E85D4A;
    border: 8px solid #B8402E;
    left: 52px;
    top: 96px;
    transform: rotate(-10deg);
  }
  .piece--si .badge { color: #E85D4A; }
  .piece--back {
    background: #3D6E96;
    border: 8px solid #2C4F73;
    right: 52px;
    bottom: 96px;
    transform: rotate(10deg);
    color: #F4B942;
  }
  /* 山界横带 */
  .band {
    position: absolute;
    left: 30px;
    right: 30px;
    top: 50%;
    height: 34px;
    transform: translateY(-50%);
    background: #EFE3CF;
    border-radius: 12px;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="band"></div>
    <div class="grid">
      <i></i><i class="rail"></i><i></i><i class="rail"></i><i></i>
      <i class="rail"></i><i></i><i class="rail"></i><i></i><i class="rail"></i>
      <i></i><i class="rail"></i><i></i><i class="rail"></i><i></i>
    </div>
    <div class="piece piece--si">司<div class="badge">9</div></div>
    <div class="piece piece--back">枫</div>
  </div>
</body>
</html>
